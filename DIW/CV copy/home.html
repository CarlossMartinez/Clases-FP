<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .phone-mockup {
        max-width: 360px;
        margin: 20px auto;
        aspect-ratio: 9 / 16;
        border: 2px solid #000;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        background: #fff;
      }
      .phone-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="phone-mockup">
      <div class="phone-content d-flex flex-column h-100 p-3">
        <div
          class="flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center"
        >
          <h1 class="display-4">Carlos Martínez Serrano</h1>
          <img
            src="https://www.nicepng.com/png/detail/367-3671905_person-icon-person-icon-silhouette.png"
            alt="Person silhouette"
            class="img-fluid opacity-25"
            style="max-width: 200px"
          />
        </div>
      </div>
    </div>
  </body>
</html>
